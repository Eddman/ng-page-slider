<!-- Native scroll-snap track; the projected *ngSliderPages are its snap children -->
<div #track
     class="track"
     [style.height.px]="sliderHeight()"
     (scroll)="onScroll()"
     (pointerdown)="emitHumanInteraction()">
    <ng-content></ng-content>
</div>

<div class="ng-slider-nav-buttons">
    <ng-slider-nav-button backward
                          [disabled]="page() === 0"
                          (navigate)="previous(); emitHumanInteraction()">
    </ng-slider-nav-button>

    <ng-slider-nav-button forward
                          [disabled]="page() >= pageCount() - 1"
                          (navigate)="next(); emitHumanInteraction()">
    </ng-slider-nav-button>
</div>

@if (showIndicator()) {
    <ng-dot-indicator [page]="page()"
                      [pageCount]="pageCount()"
                      (dotClick)="goTo($event); emitHumanInteraction()">
    </ng-dot-indicator>
}
